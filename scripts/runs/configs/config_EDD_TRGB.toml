base = ["config_priors.toml", "config_paths.toml"]

###############################################################################
#                               Inference                                     #
###############################################################################

[inference]
num_warmup = 1000
num_samples = 1000
num_chains = 1
chain_method = "parallel"
seed = 44
save_log_likelihood_per_galaxy = false
dense_mass = true

###############################################################################
#                                 Model                                       #
###############################################################################

[model]
which_run = "EDD_TRGB"

use_reconstruction = true
use_TRGB_host_redshift = true
which_bias = "linear"
which_selection = "TRGB_magnitude"

run_ppc = false
ppc_factor = 10
num_rand_los_no_recon = 1000
# max_rand_los: disabled, use all available random LOS
distmod_limits = [10, 38]
distmod_limits_LMC = [17, 20]
distmod_limits_N4258 = [28, 31]
r_limits_malmquist = [0.15, 35]

delta_mu = 0.00625
dr_max = 0.05

delta_mu_sel = 0.0875
dr_max_sel = 0.375

# 3D selection integral spherical truncation radius in Mpc/h.
selection_integral_geometry = "sphere"
selection_integral_grid_radius = 50.0
density_3d_subsample_fraction = 1.0
# Optional Gaussian smoothing scale in Mpc/h for reconstruction density fields.
# Applies consistently to LOS products and 3D field caches; 0 disables it.
field_3d_smoothing_scale = 0.0
# Optional velocity-field smoothing. Disabled unless explicitly set non-zero.
velocity_3d_smoothing_scale = 0.0
# Optional inner-region supersampling for the 3D selection integral.
# target_dx=0 or radius=0 disables inner-region supersampling.
selection_integral_supersample_radius = 15.0
selection_integral_supersample_target_dx = 0.325

mag_min_TRGB = 22.1
mag_lim_TRGB = "infer"
mag_lim_TRGB_width = "infer"

# --- Overrides from default priors ---

# TRGB absolute magnitude
[model.priors.M_TRGB]
dist = "normal"
loc = -4.05
scale = 0.5

# F606W-F814W colour pivot (Anand+22 reference value 1.23)
[model.priors.c_star]
dist = "normal"
loc = 1.23
scale = 0.1

[model.priors.alpha_c]
dist = "delta"
value = 0.2
# dist = "normal"
# loc = 0.0
# scale = 1.0

[model.priors.c_bar]
dist = "uniform"
low = 0.0
high = 3.0

[model.priors.w_c]
dist = "uniform"
low = 0.001
high = 1.0

[model.priors.sigma_int]
dist = "maxwell"
scale = 0.0627

[model.priors.sigma_v]
dist = "maxwell"
scale = 187.997121  # mean = 300 km/s

[model.priors.sigma_v_low]
dist = "maxwell"
scale = 187.997121

[model.priors.sigma_v_high]
dist = "maxwell"
scale = 187.997121

[model.priors.log_sigma_v_rho_t]
dist = "normal"
loc = 1.0
scale = 5.0

[model.priors.sigma_v_k]
dist = "truncated_normal"
low = 0.0
mean = 1.0
scale = 1.0

[model.priors.beta]
dist = "normal"
loc = 0.43
scale = 1.0

[model.priors.b1]
dist = "truncated_normal"
mean = 1.2
scale = 1.0
low = 0.0
high = 5.0

# Selection thresholds
[model.priors.mag_lim_TRGB]
dist = "uniform"
low = 22.101
high = 29.0

[model.priors.mag_lim_TRGB_width]
dist = "uniform"
low = 0.05
high = 1.5

###############################################################################
#                             TRGB Calibration                                #
###############################################################################
# Host TRGB magnitudes are in F814W. The LMC anchor is NOT -- see below.
#
# LMC geometric distance (Pietrzynski et al. 2019, arXiv:1903.08096):
#   mu_LMC = 18.477 +/- 0.026
#
# LMC TRGB magnitude (Hoyt 2023, Nat. Astron. 7, 590, arXiv:2106.13337):
#   mag_LMC_TRGB = 14.439 +/- 0.030
# This is the Rank 1+2 composite tip in the ground-based OGLE-III I band, i.e.
# 18.477 - 4.038, from his preferred flat calibration M_I = -4.038 over
# 1.60 < (V-I)_0 < 1.95. It is NOT F814W. (14.456 +/- 0.018, used until
# 2026-08-10, was his Field-19 worked example -- wrong field and wrong band.)
# The error is the non-distance rows of his table 3 (edge 0.008/0.004, sample
# 0.005/0.002, extinction 0.006/0.014, photometry 0.004/0.010 -> 0.021 mag)
# added in quadrature to a 0.020 mag I -> F814W transformation, which he
# explicitly instructs users to carry. Do NOT substitute his
# +/-0.012(stat) +/-0.032(sys): the 0.026 mag detached-eclipsing-binary term
# inside that systematic is the Pietrzynski mu_LMC prior above, which the model
# already samples, so it would be double-counted.
#
# NGC 4258 geometric distance (Reid et al. 2019):
#   mu_N4258 = 29.397 +/- 0.032
#
# NGC 4258 TRGB magnitude (Jang et al. 2021, ApJ 906, 125, arXiv:2008.04181),
# in F814W:
#   mag_N4258_TRGB = 25.347 +/- 0.0443

[model.anchors]
mu_LMC = 18.477
e_mu_LMC = 0.026
mag_LMC_TRGB = 14.439
e_mag_LMC_TRGB = 0.030
mu_N4258 = 29.397
e_mu_N4258 = 0.032
mag_N4258_TRGB = 25.347
e_mag_N4258_TRGB = 0.0443

###############################################################################
#                                  Data                                       #
###############################################################################

[io]
field_cache_project = "TRGBH0"
root_output = "results/EDD_TRGB"
fname_output = "results/EDD_TRGB/test.hdf5"

# Override reconstruction grid for TRGB (shorter range, finer grid)
[io.reconstruction_main]
rmin = 0.1
rmax = 51
num_steps = 301

[io.PV_main.EDD_TRGB]
reconstruction = "Carrick2015"
