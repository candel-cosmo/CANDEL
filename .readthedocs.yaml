version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
    - method: pip
      path: packages/candel-pv
    - method: pip
      path: packages/candel-ch0
    - method: pip
      path: packages/candel-trgb
    - method: pip
      path: packages/candel-mwcepheids
    - method: pip
      path: packages/candel-maser
