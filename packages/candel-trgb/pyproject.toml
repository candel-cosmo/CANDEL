[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "candel-trgb"
version = "0.1.0"
description = "TRGB-calibrated H0 forward model for CANDEL"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Richard Stiskalek"}]
dependencies = ["candel"]

[project.entry-points."candel.probes"]
EDD_TRGB = "candel_trgb.probe:TRGBProbe"

[tool.setuptools.packages.find]
include = ["candel_trgb*"]

[project.urls]
Repository = "https://github.com/candel-cosmo/CANDEL"
