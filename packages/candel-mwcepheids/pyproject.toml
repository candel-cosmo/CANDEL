[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "candel-mwcepheids"
version = "0.1.0"
description = "Milky Way Cepheid calibration model for CANDEL"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Richard Stiskalek"}]
dependencies = ["candel"]

[project.entry-points."candel.probes"]
MWCepheids = "candel_mwcepheids.probe:MWCepheidsProbe"

[tool.setuptools.packages.find]
include = ["candel_mwcepheids*"]

[project.urls]
Repository = "https://github.com/candel-cosmo/candel-mwcepheids"
Core = "https://github.com/candel-cosmo/CANDEL"
