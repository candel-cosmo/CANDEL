[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "candel-ch0"
version = "0.1.0"
description = "Cepheid-calibrated H0 forward model for CANDEL"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Richard Stiskalek"}]
dependencies = ["candel"]

[project.entry-points."candel.probes"]
CH0 = "candel_ch0.probe:CH0Probe"

[tool.setuptools.packages.find]
include = ["candel_ch0*"]

[project.urls]
Repository = "https://github.com/candel-cosmo/candel-ch0"
Core = "https://github.com/candel-cosmo/CANDEL"
